workflows:
  android-workflow:
    name: WeLoop Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.weloop.local"
      node: 18
      npm: 8
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build APK
        script: |
          npx expo prebuild
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - nuthalapatisureshbabu9@gmail.com