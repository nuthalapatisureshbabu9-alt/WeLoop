workflows:
  android-workflow:
    name: WeLoop Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install -g eas-cli
          npm install
      - name: Build APK with EAS
        script: |
          eas build --platform android --profile preview --non-interactive --no-wait || npx expo prebuild --platform android --clean --no-install && cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
